<style>
/* Layout concept: an answer-sheet record. One narrow column, ruled rows, bubble checkboxes, red marking pen reserved for today and the exam date. */
:root{
  --paper:#EEF2F5; --surface:#FFFFFF; --ink:#0F1C2B; --ink2:#4B5B6C; --rule:#CAD5DE;
  --pen:#C0392B; --pen-ink:#FFFFFF;
  --L:#2B6CB0; --R:#2F855A; --W:#A8691A; --S:#6D5A9C;
  --good:#2F855A; --warn:#A8691A;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1620; --surface:#15212D; --ink:#E7EEF4; --ink2:#9EB0C1; --rule:#2A3A4A;
    --pen:#F07563; --pen-ink:#1A0F0D;
    --L:#74ABEA; --R:#62C08F; --W:#E3AC52; --S:#AB98D9;
    --good:#62C08F; --warn:#E3AC52;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1620; --surface:#15212D; --ink:#E7EEF4; --ink2:#9EB0C1; --rule:#2A3A4A;
  --pen:#F07563; --pen-ink:#1A0F0D;
  --L:#74ABEA; --R:#62C08F; --W:#E3AC52; --S:#AB98D9;
  --good:#62C08F; --warn:#E3AC52;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55;
  padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:600}

/* top */
.top{padding:22px 0 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{font-size:clamp(34px,8vw,52px);font-weight:800;letter-spacing:-.02em}
.top h1 em{font-style:normal;color:var(--pen)}
.stat{text-align:right;min-width:0}
.stat .mono{font-size:22px;display:block}
.stat .lbl{font-size:12px;color:var(--ink2)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:12px 14px 10px;font-weight:600;color:var(--ink2);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pen)}
.tab:focus-visible,.btn:focus-visible,.row:focus-visible,summary:focus-visible{outline:3px solid var(--pen);outline-offset:2px}

main{padding-top:20px;display:grid;gap:22px}

/* day header */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--rule)}
.daytitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.daytitle h2{font-size:clamp(26px,6vw,34px);font-weight:800}
.daytitle .date{color:var(--ink2);font-weight:500}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border:1.5px solid var(--ink2);border-radius:99px;color:var(--ink2)}
.pill.pen{border-color:var(--pen);color:var(--pen)}
.pill.good{border-color:var(--good);color:var(--good)}
.phase{color:var(--ink2);font-size:14px}

.meter{display:grid;gap:8px}
.meter-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.meter-top .mono{font-size:20px}
.track{height:10px;background:var(--rule);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

.sched{display:grid;gap:0;border:1.5px solid var(--ink);background:var(--surface);border-radius:4px}
.sched div{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:9px 12px;align-items:center;border-top:1px solid var(--rule)}
.sched div:first-child{border-top:0}
.sched .tm{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.sched .sk{font-weight:600;min-width:0}
.sched .du{color:var(--ink2);font-size:13px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--c)}

.sec{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:14px 14px 4px;--c:var(--ink)}
.sec.L{--c:var(--L)} .sec.R{--c:var(--R)} .sec.W{--c:var(--W)} .sec.S{--c:var(--S)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.sec-h h3{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.chip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:4px;background:var(--c);color:var(--surface);font-family:var(--f-mono);font-size:13px}
.sec-h .du{color:var(--ink2);font-size:13px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--rule);cursor:pointer}
.task input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--ink2);border-radius:50%;margin:1px 0 0;display:grid;place-content:center;cursor:pointer;background:transparent}
.task input::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);transform:scale(0);transition:transform .12s}
.task input:checked{border-color:var(--c)}
.task input:checked::before{transform:scale(1)}
.task input:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.task .tt{min-width:0}
.task .prio{display:inline-block;font-size:10px;line-height:1.5;font-weight:800;letter-spacing:.04em;border-radius:5px;padding:2px 6px;margin:0 6px 3px 0;vertical-align:1px;white-space:nowrap}
.task .prio.p1{background:#fce8a4;color:#604600;border:1px solid #e4c65d}
.task .prio.p2{background:var(--soft);color:var(--ink2);border:1px solid var(--rule)}
.task .mm{font-family:var(--f-mono);font-size:13px;color:var(--ink2);white-space:nowrap;padding-top:2px}
.task.done .tt{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--rule)}

.note{border-left:3px solid var(--pen);padding:2px 0 2px 12px;color:var(--ink2);font-size:14px}
.habits{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:14px 14px 4px;--c:var(--pen)}
.habits h3{font-size:17px;margin-bottom:4px}
textarea{width:100%;font:inherit;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink2);border-radius:4px;padding:10px;resize:vertical;min-height:64px}
label.f{display:grid;gap:6px;font-weight:600;font-size:14px}

.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.backup-actions .btn{font-size:12px;padding:7px 10px}
/* plan list */
.ph{display:grid;gap:2px;margin-top:6px}
.ph h3{font-size:20px;font-weight:700}
.ph p{color:var(--ink2);font-size:14px}
.list{border:1.5px solid var(--ink);background:var(--surface);border-radius:4px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--rule);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--paper)}
.row.today{box-shadow:inset 4px 0 0 var(--pen)}
.row .n{font-family:var(--f-display);font-weight:800;font-size:22px}
.row .d{display:grid;gap:5px;min-width:0}
.row .d b{font-weight:600}
.row .d span{color:var(--ink2);font-size:13px}
.row .h{font-family:var(--f-mono);font-size:13px;color:var(--ink2);white-space:nowrap}
.mini{height:5px;background:var(--rule);border-radius:99px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ink)}

/* text blocks */
.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:16px;display:grid;gap:10px}
.card h2{font-size:24px;font-weight:800}
.card h3{font-size:18px;font-weight:700}
.card ul,.card ol{margin:0;padding-left:20px;display:grid;gap:6px}
.card p{max-width:65ch}
details{border-top:1px solid var(--rule);padding:10px 0}
details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer;padding:4px 0}
details > *:not(summary){margin-top:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{border-bottom:1px solid var(--rule);padding:9px 8px;text-align:left}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
td.mono,th.mono{text-align:center}
input[type=number]{width:64px;font:inherit;font-family:var(--f-mono);background:var(--paper);color:var(--ink);border:1.5px solid var(--ink2);border-radius:4px;padding:6px 4px;text-align:center}
.ovr{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center}
.gauge{position:relative;height:34px;margin:22px 0 28px}
.gauge .gt{position:absolute;left:0;right:0;top:14px;height:6px;background:var(--rule);border-radius:99px}
.gauge .mk{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.gauge .mk.on{background:var(--ink)}
.gauge .tg{position:absolute;top:0;bottom:0;width:2px;background:var(--pen)}
.gauge .tl{position:absolute;top:-18px;transform:translateX(-50%);font-size:12px;color:var(--pen);font-weight:600;white-space:nowrap}
.gauge .sc{position:absolute;top:30px;font-size:11px;color:var(--ink2);transform:translateX(-50%)}
.q{color:var(--ink2);font-size:14px}
</style>

var dbDoc=null,saveTimer=null,saving=false;
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  if(!dbDoc)return;
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
function flush(){
  if(saving){saveTimer=setTimeout(flush,300);return;}
  saving=true;
  dbDoc.set({c:S.c,m:S.m,n:S.n,t:Date.now()}).catch(function(){}).then(function(){saving=false;});
}
function key(n,k,i){return "d"+n+"-"+k+i;}
function isOn(k){return !!S.c[k];}
function doneMin(p){
  var s=0;["L","R","W","S"].forEach(function(k){p.T[k].forEach(function(t,i){if(isOn(key(p.n,k,i)))s+=t.m;});});
  return s;
}
function totals(){
  var d=0,t=0;
  for(var n=1;n<=31;n++){var p=mk(n);d+=doneMin(p);t+=p.tot;}
  return {done:d,tot:t};
}
function streak(tn){
  var n=Math.min(tn,31);if(n<1)return 0;
  var s=0;
  if(doneMin(mk(n))<180)n--;
  while(n>=1&&doneMin(mk(n))>=180){s++;n--;}
  return s;
}

    ["Body paragraf formulasi (PEEL)",

     "<p>5 daqiqa reja (g'oyalar va misollar), 30 daqiqa yozish, 5 daqiqa tekshirish. Rejasiz boshlamang.</p>"]
  ]},
  {c:"S",t:"Speaking: 5,5-6 dan chiqish",b:[
    ["Part 2 (2 daqiqa)",
     "<ul><li>1 daqiqada 4 ta so'rov so'zini (nima, qayerda, kim, nega) yozing.</li><li>Tuzilma: kirish, 3 ta detal, oxirida nega muhimligi/his.</li><li>To'xtab qolsangiz sukut qilmang: <b>Let me think...</b>, <b>What I mean is...</b> deb davom eting.</li></ul>"],

  return sec.map(function(s){
    return '<section class="card sec '+s.c+'" style="border-color:var(--ink)"><h2 style="display:flex;gap:10px;align-items:center"><span class="chip">'+s.c+'</span>'+s.t+'</h2>'+

function overall(v){
  if(!v)return null;
  var a=["L","R","W","S"].map(function(k){return parseFloat(String(v[k]).replace(",","."));});
  if(a.some(function(x){return isNaN(x);}))return null;
  return Math.round(a.reduce(function(p,c){return p+c;},0)/4*2)/2;
}
var BASE={L:6,R:6,W:6,S:6};
var MROWS=[["m1","20-okt","6,0-6,5"],["m2","27-okt","6,5"],["m3","3-noy","6,5-7,0"],["m4","10-noy","7,0"]];

function mockView(){
  var rows='<tr><td>Boshlang\'ich (oxirgi mock)</td>'+["L","R","W","S"].map(function(k){return '<td class="mono">'+BASE[k].toFixed(1)+'</td>';}).join("")+'<td class="ovr">6.0</td><td class="mono">—</td></tr>';
  MROWS.forEach(function(r){
    var v=S.m[r[0]]||{};
    rows+='<tr><td>'+r[1]+'</td>'+["L","R","W","S"].map(function(k){
      return '<td class="mono"><input type="number" inputmode="decimal" step="0.5" min="0" max="9" id="in-'+r[0]+k+'" data-act="mock" data-id="'+r[0]+'" data-s="'+k+'" value="'+(v[k]!==undefined?esc(v[k]):"")+'" aria-label="'+r[1]+' '+SK[k]+'"></td>';
    }).join("")+'<td class="ovr" id="ov-'+r[0]+'">'+fmtOv(overall(v))+'</td><td class="mono">'+r[2]+'</td></tr>';
  });
  rows+='<tr><td><b>Real maqsad</b></td><td class="mono">7.5</td><td class="mono">7.0</td><td class="mono">6.5</td><td class="mono">6.5</td><td class="ovr">7.0</td><td class="mono"></td></tr>';
  return '<section class="card"><h2>Mock natijalari</h2><p class="q">Ballarni mockdan keyin kiriting, umumiy ball IELTS qoidasi bo\'yicha 0,5 ga yaxlitlanadi. Writing va Speaking ni o\'zingiz baholasangiz, ular 0,5 ga adashishi mumkin. Haftada bir marta o\'qituvchi yoki tajribali kishiga ko\'rsating.</p>'+
    '<div class="tw"><table><thead><tr><th>Sana</th><th class="mono">L</th><th class="mono">R</th><th class="mono">W</th><th class="mono">S</th><th class="mono">Overall</th><th class="mono">Kutilgan</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div id="gauge">'+gaugeHtml()+'</div></section>'+
    '<section class="card"><h3>Har mockdan keyin</h3><ul><li>Eng past ikki bo\'limni toping.</li><li>Keyingi haftada o\'sha ikki bo\'limga +20 daqiqa bering, eng baland bo\'limdan -20 daqiqa oling. Umumiy soat o\'zgarmaydi.</li><li>Xato turlarini qayta sanang, eng ko\'p xato turi kelasi haftaning birinchi mashqi bo\'lsin.</li></ul></section>';
}
function fmtOv(v){return v===null?"—":v.toFixed(1);}
function gaugeHtml(){
  var last=null;
  MROWS.forEach(function(r){var o=overall(S.m[r[0]]);if(o!==null)last=o;});
  function pos(x){return Math.max(0,Math.min(100,(x-5)/3*100));}
  var h='<div class="gauge"><div class="gt"></div><div class="tg" style="left:'+pos(7)+'%"></div><div class="tl" style="left:'+pos(7)+'%">7.0</div>'+
    '<div class="mk" style="left:'+pos(6)+'%" title="Boshlang\'ich 6.0"></div>';
  if(last!==null)h+='<div class="mk on" style="left:'+pos(last)+'%" title="Oxirgi mock"></div>';
  [5,5.5,6,6.5,7,7.5,8].forEach(function(x){h+='<div class="sc" style="left:'+pos(x)+'%">'+x.toFixed(1)+'</div>';});
  return h+'</div><p class="q">Bo\'sh doira: boshlang\'ich 6.0. To\'ldirilgan doira: oxirgi mock'+(last!==null?" ("+last.toFixed(1)+")":" (hali kiritilmagan)")+'. Qizil chiziq: 7.0.</p>';
}

  return '<section class="card"><h2>Bir oyda +1 yoki +1,5 mumkinmi?</h2>'+
  '<p><b>+1 (overall 7.0) mumkin, lekin kafolat yo\'q. +1,5 (overall 7.5) amalda real emas.</b></p>'+
  '<p>Overall 7.0 uchun to\'rt bo\'limning o\'rtachasi kamida 6,75 bo\'lishi kerak. Hozir hammasi 6, ya\'ni har bo\'lim o\'rtacha +0,75 o\'sishi shart. Hammasini baravar o\'stirish shart emas.</p>'+
  '<div class="tw"><table><thead><tr><th>Bo\'lim</th><th class="mono">Hozir</th><th class="mono">Real yo\'l</th><th class="mono">Nima uchun</th></tr></thead><tbody>'+
  '<tr><td>Listening</td><td class="mono">6.0</td><td class="mono">7.5</td><td>texnika + xato turlari</td></tr>'+

  '<section class="card"><h3>Nega mumkin</h3><ul>'+
  '<li>Listening va Reading dagi xatolaringiz aniq turlarda (Part 3-4, T/F/NG, matching). Bu texnika va mashq bilan bir oyda yopiladi.</li>'+
  '<li>Mashqlar xato daftari va vaqtli testlar bilan qurilgan, sizga aynan o\'sha tur kerak.</li>'+
  '<li>Reja 19-oktyabrda boshlanadi, 30 kunlik o‘qish 17-noyabrda tugaydi; 18-noyabr yengil kun, imtihon 19-noyabr.</li></ul>'+
  '<h3>Nega qiyin</h3><ul>'+
  '<li>Writing va Speaking til darajasiga (grammatik aniqlik, fikr rivoji) bog\'liq, ular sekin o\'zgaradi. Bir oyda +0,5 ham mashq sifatiga bog\'liq.</li>'+
  '<li>7.5 uchun o\'rtacha 7,25 kerak: masalan Listening va Reading ikkalasi 8.0 bo\'lishi lozim. Bir oyda +2 ball bunday sakrash odatiy emas.</li>'+

  '<li>Eng katta xavf bilim emas, hajm: hozir 2-3 soat qilinmoqda, rejaning kamida 80 foizi bajarilmasa 7.0 ehtimoli keskin pasayadi.</li></ul>'+
  '<h3>Nimani nazorat qilasiz</h3><ul>'+
  '<li>27-oktyabr mocki: Listening va Reading kamida 6,5 bo\'lmasa, Writing/Speaking vaqtidan 20 daqiqadan olib L/R ga bering.</li>'+
  '<li>3-noyabr mocki: overall 6,5 dan past bo\'lsa, faqat zaif savol turlariga o\'ting, yangi material olmang.</li>'+
  '<li>Imtihondan keyingi natijaga qarab maqsadni qayta baholaysiz. 6,5 ham 6 dan aniq yutuq.</li></ul></section>';
}

function rulesView(){
  return '<section class="card"><h2>Intizom, irodasiz</h2><p class="q">Rejaning 2-3 soatga tushib ketishi odatda iroda yetmasligidan emas, reja va muhit mos kelmasligidan.</p><ol>'+
  '<li><b>Kunlik minimum 3 soat.</b> Yomon kunda ham 1 ta Listening bloki, 1 ta Reading bloki, 20 daqiqa Speaking. Nol kun bo\'lmasin.</li>'+
  '<li><b>Ertalab.</b> Budilnik xona narigi chetida. Ko\'z ochilgach 5 soniyada oyoq yerga. Bir stakan suv. Stol kechadan tayyor, birinchi vazifa yozilgan.</li>'+
  '<li><b>Telefon.</b> Bloklar paytida boshqa xonada. Kompyuterda Telegram Web, YouTube va Instagram blokda.</li>'+
  '<li><b>50 / 10.</b> 50 daqiqa ishlang, 10 daqiqa turib yuring. Tanaffusda telefonga o\'tirmang.</li>'+
  '<li><b>Boshlash qiyin bo\'lsa.</b> Faqat 2 daqiqa ishlayman deng. Boshlagach davom etish osonlashadi.</li>'+

  '<li><b>Javobgarlik.</b> Har kech bir kishiga (do\'st, o\'qituvchi) bugungi soatni yuboring.</li>'+
  '<li><b>Haftalik tahlil.</b> Yakshanba kechqurun: nega kam bo\'ldi? Chalg\'ish yozuvlaringizdan eng ko\'p takrorlangan sababni toping va bitta chorasini belgilang.</li></ol></section>';
}

function render(focusKey){
  renderTop();renderTabs();
  var h="";
  if(view==="day")h=dayView(sel);
  else if(view==="plan")h=planView();
  else if(view==="tech")h=techView();
  else if(view==="mock")h=mockView();
  else if(view==="goal")h=goalView();
  else h=rulesView();
  app.innerHTML=h;
  if(focusKey){var el=app.querySelector('[data-k="'+focusKey+'"]');if(el)el.focus();}
}

function exportProgress(){
  var payload={app:"IELTSEasy 30 kunlik reja",version:1,exportedAt:new Date().toISOString(),state:S};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="ielts-progress-backup.json";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importProgress(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result),state=data.state||data;
      if(!state||typeof state!=="object"||!state.c)throw new Error("Noto'g'ri backup");
      S={c:state.c||{},m:state.m||{},n:state.n||{}};
      persist();render();
      alert("Progress backupdan tiklandi.");
    }catch(e){alert("Backup faylini o'qib bo'lmadi. To'g'ri JSON backup faylini tanlang.");}
  };
  reader.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act");
  if(a==="backup"){exportProgress();}
  else if(a==="restore"){var rf=document.getElementById("restore-file");if(rf)rf.click();}
  else if(a==="tab"){view=t.getAttribute("data-v");render();window.scrollTo(0,0);}
  else if(a==="nav"){sel=Math.min(32,Math.max(1,sel+parseInt(t.getAttribute("data-d"),10)));render();}
  else if(a==="today"){sel=Math.min(Math.max(todayNum(),1),32);render();}
  else if(a==="open"){sel=parseInt(t.getAttribute("data-n"),10);view="day";render();window.scrollTo(0,0);}
});
document.addEventListener("change",function(e){
  var t=e.target;if(t&&t.id==="restore-file"){importProgress(t.files&&t.files[0]);t.value="";return;}
  if(!t.getAttribute||t.getAttribute("data-act")!=="chk")return;
  var k=t.getAttribute("data-k");
  if(t.checked)S.c[k]=1;else delete S.c[k];
  persist();render(k);
});
document.addEventListener("input",function(e){
  var t=e.target;if(!t.getAttribute)return;
  var a=t.getAttribute("data-act");
  if(a==="note"){
    if(t.value)S.n[sel]=t.value;else delete S.n[sel];
    persist();
  }else if(a==="mock"){
    var id=t.getAttribute("data-id"),s=t.getAttribute("data-s");
    S.m[id]=S.m[id]||{};
    if(t.value==="")delete S.m[id][s];else S.m[id][s]=t.value;
    persist();
    var o=document.getElementById("ov-"+id);if(o)o.textContent=fmtOv(overall(S.m[id]));
    var g=document.getElementById("gauge");if(g)g.innerHTML=gaugeHtml();
  }
});

render();

/* ---------- synced storage (db), falls back to this browser ---------- */
(function(){
  var cl=window.claude;if(!cl||!cl.use)return;
  Promise.all([cl.use("db"),cl.use("user")]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){
      if(!id)return;
      var ref=db.doc("data/users/"+id+"/tracker");
      return ref.get().then(function(snap){
        if(snap.exists){
          var d=snap.data()||{};
          S={c:d.c||{},m:d.m||{},n:d.n||{}};
          try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
          dbDoc=ref;
          var ae=document.activeElement;
          if(!(ae&&ae.tagName==="TEXTAREA"))render();
        }else{
          dbDoc=ref;
          if(Object.keys(S.c).length||Object.keys(S.m).length||Object.keys(S.n).length)persist();
        }
      });
    });
  }).catch(function(){});
})();
})();
